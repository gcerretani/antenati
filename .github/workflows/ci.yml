name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # hatch-vcs derives the version from git tags; needed even for
        # editable installs so `import antenati; antenati.__version__`
        # doesn't fall back to `0.0.0+local` during type-checking.
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install package + dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Ruff check
      run: ruff check .

    - name: Ruff format check
      run: ruff format --check .

    - name: Mypy
      run: mypy src/antenati

  test:
    name: Offline tests (${{ matrix.python-version }} / ${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-24.04', 'macos-14', 'windows-2022']
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package + dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run offline test suite
      run: pytest -m "not integration"

    - name: Smoke `antenati --help`
      run: antenati --help

    - name: Smoke `python -m antenati --version`
      run: python -m antenati --version

  # This is the required status check configured on the `master` branch
  # ruleset. Do not rename this job without updating the ruleset
  # (repos/gcerretani/antenati/rulesets/6842887) to match.
  ci-passed:
    name: CI passed
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
    - name: Check all required jobs succeeded
      run: |
        if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
          echo "One or more required jobs did not succeed."
          exit 1
        fi
