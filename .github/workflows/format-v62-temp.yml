name: Temporary v6.2 formatter

on:
  push:
    branches:
      - release/v6.2-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v6.2-hardening
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install ruff==0.15.8
      - run: ruff format src/antenati/downloader.py tests/test_hardening.py
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/antenati/downloader.py tests/test_hardening.py
            git commit -m 'style: apply Ruff formatting'
            git push origin HEAD:release/v6.2-hardening
          fi
