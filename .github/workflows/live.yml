name: Live download

on:
  # Run on demand from the Actions tab.
  workflow_dispatch:
  # Daily canary so we hear early if SAN changes the gallery shape or one of
  # the public IIIF layers becomes unavailable.
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

jobs:
  gallery-html:
    name: Canary - gallery HTML
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install package + test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check gallery HTML and manifest discovery
      timeout-minutes: 2
      run: pytest -m integration tests/integration/test_live_download.py::test_gallery_html_canary -v

  direct-manifest:
    name: Canary - direct IIIF manifest
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install package + test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check direct manifest backend
      timeout-minutes: 2
      run: pytest -m integration tests/integration/test_live_download.py::test_direct_manifest_canary -v

  image-download:
    name: Canary - IIIF image download
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install package + test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Download one live IIIF image
      timeout-minutes: 2
      run: pytest -m integration tests/integration/test_live_download.py::test_image_download_canary -v
