name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  pyinstaller:
    name: PyInstaller (${{ matrix.runs-on }})
    strategy:
      fail-fast: false
      matrix:
        runs-on: ['ubuntu-22.04', 'macos-14', 'windows-2022']
    runs-on: ${{ matrix.runs-on }}
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
        # hatch-vcs derives the package version from the repository tags.
        # A shallow checkout can therefore produce the wrong version metadata.
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'

    - name: Install package + release tooling
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install -r requirements/release.txt

    - name: Build standalone GUI binary
      run: pyinstaller --windowed --onefile --name antenati_gui src/antenati/gui/__main__.py

    - name: Generate SBOM
      run: cyclonedx-py environment -o antenati_gui.cdx.json

    - name: Upload artifact for Windows
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: antenati_gui_windows.exe
        path: dist/antenati_gui.exe

    - name: Upload artifact for macOS and Ubuntu
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: antenati_gui_${{ matrix.runs-on }}
        path: dist/antenati_gui

    - name: Upload SBOM for Windows
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: antenati_gui_windows.cdx.json
        path: antenati_gui.cdx.json

    - name: Upload SBOM for macOS and Ubuntu
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: antenati_gui_${{ matrix.runs-on }}.cdx.json
        path: antenati_gui.cdx.json

  build-distribution:
    name: Build sdist + wheel
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
        # Keep tags available here as well because the wheel/sdist version is
        # generated from git metadata by hatch-vcs.
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'

    - name: Install build front-end
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/release.txt

    - name: Build sdist and wheel
      run: python -m build

    - name: Report version
      id: version
      run: |
        version=$(ls dist/*.whl | head -1 | sed -E 's@.*/antenati-(.+)-py3.*@\1@')
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Built antenati $version"

    - name: Upload distribution artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist
        path: dist/*

  publish-pypi:
    name: Publish to PyPI
    # Manual workflow_dispatch runs are useful for validating builds, but must
    # never republish a package version. Publication happens only for v* tags.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-distribution]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/antenati/${{ needs.build-distribution.outputs.version }}
    permissions:
      # Trusted Publishing uses the GitHub OIDC token; no long-lived PyPI API
      # token is stored in repository secrets.
      id-token: write
    steps:
    - name: Download distribution artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  create-github-release:
    name: Create GitHub release
    needs: [pyinstaller, build-distribution]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Download GUI artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts
        pattern: antenati_gui_*

    - name: Package release assets
      run: |
        mkdir -p release-assets
        # upload-artifact/download-artifact does not preserve Unix mode bits.
        # Restore them before zipping so extracted macOS/Linux binaries remain executable.
        chmod +x artifacts/antenati_gui_macos-14/antenati_gui
        chmod +x artifacts/antenati_gui_ubuntu-22.04/antenati_gui
        zip -j release-assets/antenati_gui_windows.exe.zip \
            artifacts/antenati_gui_windows.exe/antenati_gui.exe
        zip -j release-assets/antenati_gui_macos-14.zip \
            artifacts/antenati_gui_macos-14/antenati_gui
        zip -j release-assets/antenati_gui_ubuntu-22.04.zip \
            artifacts/antenati_gui_ubuntu-22.04/antenati_gui
        cp artifacts/antenati_gui_windows.cdx.json/antenati_gui.cdx.json \
            release-assets/antenati_gui_windows.cdx.json
        cp artifacts/antenati_gui_macos-14.cdx.json/antenati_gui.cdx.json \
            release-assets/antenati_gui_macos-14.cdx.json
        cp artifacts/antenati_gui_ubuntu-22.04.cdx.json/antenati_gui.cdx.json \
            release-assets/antenati_gui_ubuntu-22.04.cdx.json

    - name: Verify Unix executable modes in release archives
      run: |
        rm -rf verify-macos verify-linux
        mkdir verify-macos verify-linux
        unzip -q release-assets/antenati_gui_macos-14.zip -d verify-macos
        unzip -q release-assets/antenati_gui_ubuntu-22.04.zip -d verify-linux
        test -x verify-macos/antenati_gui
        test -x verify-linux/antenati_gui

    - name: Extract release notes from CHANGELOG
      run: |
        version="${GITHUB_REF_NAME#v}"
        awk '/^## \['"$version"'\]/{found=1; next} /^## \[/{if(found) exit} found{print}' \
            CHANGELOG.md > release-notes.md

    - name: Create GitHub release
      run: |
        gh release create "$GITHUB_REF_NAME" \
          --title "$GITHUB_REF_NAME" \
          --notes-file release-notes.md \
          release-assets/antenati_gui_windows.exe.zip \
          release-assets/antenati_gui_macos-14.zip \
          release-assets/antenati_gui_ubuntu-22.04.zip \
          release-assets/antenati_gui_windows.cdx.json \
          release-assets/antenati_gui_macos-14.cdx.json \
          release-assets/antenati_gui_ubuntu-22.04.cdx.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
