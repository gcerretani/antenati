name: Release
#
# Publication order and failure policy:
#   tests + security -> build-distribution + pyinstaller -> draft-github-release
#     -> publish-pypi -> publish-github-release -> release-summary
#
# The GitHub release is created as a draft *before* PyPI publication and only
# made public after PyPI succeeds, so a failure never leaves a public GitHub
# release without a matching PyPI release. If PyPI publication itself fails,
# only an unpublished draft exists (visible to maintainers, not to users). If
# the final "undraft" step fails after PyPI succeeded, release-summary detects
# and loudly reports that partial state.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml

  security:
    name: Security
    uses: ./.github/workflows/security.yml

  pyinstaller:
    name: PyInstaller (${{ matrix.label }})
    needs: [tests, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: windows-2022
            label: windows
            exe: antenati_gui.exe
            zip_name: antenati_gui_windows.exe.zip
            sbom_name: antenati_gui_windows.cdx.json
          - runs-on: macos-14
            label: macos-14
            exe: antenati_gui
            zip_name: antenati_gui_macos-14.zip
            sbom_name: antenati_gui_macos-14.cdx.json
          - runs-on: ubuntu-22.04
            label: ubuntu-22.04
            exe: antenati_gui
            zip_name: antenati_gui_ubuntu-22.04.zip
            sbom_name: antenati_gui_ubuntu-22.04.cdx.json
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
        # hatch-vcs derives the package version from the repository tags.
        # A shallow checkout can therefore produce the wrong version metadata.
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'

    - name: Install package + release tooling
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install -r requirements/release.txt

    - name: Build standalone GUI binary
      run: pyinstaller --windowed --onefile --name antenati_gui src/antenati/gui/__main__.py

    - name: Generate SBOM
      run: cyclonedx-py environment -o ${{ matrix.sbom_name }}

    - name: Package the executable (preserves Unix permission bits in the zip)
      run: python -c "import zipfile; zf = zipfile.ZipFile('${{ matrix.zip_name }}', 'w', zipfile.ZIP_DEFLATED); zf.write('dist/${{ matrix.exe }}', arcname='${{ matrix.exe }}'); zf.close()"

    - name: Extract archive and smoke test the executable (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        rm -rf smoke-test
        unzip ${{ matrix.zip_name }} -d smoke-test
        test -x smoke-test/${{ matrix.exe }}
        version=$(smoke-test/${{ matrix.exe }} --version)
        test -n "$version"
        echo "Reported version: $version"
        if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag_version" ]; then
            echo "::error::Packaged executable reports version $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
        fi

    - name: Extract archive and smoke test the executable (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Remove-Item -Recurse -Force smoke-test -ErrorAction SilentlyContinue
        Expand-Archive -Path ${{ matrix.zip_name }} -DestinationPath smoke-test
        $proc = Start-Process -FilePath "smoke-test\${{ matrix.exe }}" -ArgumentList '--version' -Wait -PassThru -NoNewWindow -RedirectStandardOutput smoke-test-out.txt
        if ($proc.ExitCode -ne 0) {
          throw "antenati_gui.exe --version exited with code $($proc.ExitCode)"
        }
        $version = (Get-Content smoke-test-out.txt -Raw).Trim()
        if ([string]::IsNullOrEmpty($version)) {
          throw "antenati_gui.exe --version produced no output"
        }
        Write-Host "Reported version: $version"
        if ("${{ github.ref }}".StartsWith('refs/tags/v')) {
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($version -ne $tagVersion) {
            throw "Packaged executable reports version $version but the tag is ${{ github.ref_name }}"
          }
        }

    - name: Upload packaged executable
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ matrix.zip_name }}
        path: ${{ matrix.zip_name }}

    - name: Upload SBOM
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ matrix.sbom_name }}
        path: ${{ matrix.sbom_name }}

  build-distribution:
    name: Build sdist + wheel
    needs: [tests, security]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
        # Keep tags available here as well because the wheel/sdist version is
        # generated from git metadata by hatch-vcs.
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'

    - name: Install build front-end
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/release.txt

    - name: Build sdist and wheel
      run: python -m build

    - name: Report version
      id: version
      run: |
        version=$(ls dist/*.whl | head -1 | sed -E 's@.*/antenati-(.+)-py3.*@\1@')
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Built antenati $version"

    - name: Smoke test the built wheel
      run: |
        python -m venv .wheel-venv
        .wheel-venv/bin/pip install --quiet dist/*.whl
        installed=$(.wheel-venv/bin/antenati --version)
        test "$installed" = "${{ steps.version.outputs.version }}"

    - name: Upload distribution artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist
        path: dist/*

  draft-github-release:
    name: Draft GitHub release
    needs: [pyinstaller, build-distribution]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Verify built version matches the pushed tag
      run: |
        version="${GITHUB_REF_NAME#v}"
        built="${{ needs.build-distribution.outputs.version }}"
        if [ "$built" != "$version" ]; then
          echo "::error::Built package version ($built) does not match tag ($GITHUB_REF_NAME)"
          exit 1
        fi

    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Download distribution artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist

    - name: Download GUI artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts
        pattern: antenati_gui_*

    - name: Assemble and checksum release assets
      run: |
        mkdir -p release-assets
        cp dist/*.whl dist/*.tar.gz release-assets/
        cp artifacts/*/*.zip artifacts/*/*.cdx.json release-assets/
        (cd release-assets && sha256sum -- * > SHA256SUMS)
        ls -l release-assets

    - name: Extract release notes from CHANGELOG
      run: |
        version="${GITHUB_REF_NAME#v}"
        awk '/^## \['"$version"'\]/{found=1; next} /^## \[/{if(found) exit} found{print}' \
            CHANGELOG.md > release-notes.md

    - name: Create or update draft GitHub release
      run: |
        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          # Re-run of a workflow that already created (and possibly published)
          # a release for this tag: refresh its assets/notes and force it
          # back to draft so publish-github-release un-drafts it only after
          # PyPI has been re-verified below.
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        else
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            release-assets/*
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    # Manual workflow_dispatch runs are useful for validating builds, but must
    # never republish a package version. Publication happens only for v* tags.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-distribution, draft-github-release]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/antenati/${{ needs.build-distribution.outputs.version }}
    permissions:
      # Trusted Publishing uses the GitHub OIDC token; no long-lived PyPI API
      # token is stored in repository secrets.
      id-token: write
    steps:
    - name: Download distribution artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-distribution, publish-pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Un-draft the GitHub release
      run: gh release edit "$GITHUB_REF_NAME" --draft=false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}

    - name: Verify the version is live on PyPI
      run: |
        version="${{ needs.build-distribution.outputs.version }}"
        for attempt in 1 2 3 4 5; do
          if curl -fsS "https://pypi.org/pypi/antenati/$version/json" >/dev/null; then
            echo "antenati $version is live on PyPI"
            exit 0
          fi
          echo "PyPI does not yet report antenati $version (attempt $attempt/5), retrying..."
          sleep 15
        done
        echo "::error::antenati $version was published but is not visible on PyPI after retries"
        exit 1

  release-summary:
    name: Release summary
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [build-distribution, pyinstaller, draft-github-release, publish-pypi, publish-github-release]
    runs-on: ubuntu-24.04
    steps:
    - name: Report publication status
      run: |
        {
          echo "| Stage | Result |"
          echo "|---|---|"
          echo "| Build sdist/wheel | ${{ needs.build-distribution.result }} |"
          echo "| Build PyInstaller executables | ${{ needs.pyinstaller.result }} |"
          echo "| Draft GitHub release | ${{ needs.draft-github-release.result }} |"
          echo "| Publish to PyPI | ${{ needs.publish-pypi.result }} |"
          echo "| Publish GitHub release | ${{ needs.publish-github-release.result }} |"
        } >> "$GITHUB_STEP_SUMMARY"

        pypi="${{ needs.publish-pypi.result }}"
        ghrelease="${{ needs.publish-github-release.result }}"
        version="${{ needs.build-distribution.outputs.version }}"

        if [ "$pypi" = "success" ] && [ "$ghrelease" != "success" ]; then
          echo "::error::PARTIAL PUBLICATION: antenati $version was published to PyPI, but the GitHub release was not published (still draft or the un-draft step failed). Investigate and publish it manually with: gh release edit $GITHUB_REF_NAME --draft=false"
          exit 1
        fi
        if [ "$ghrelease" = "success" ] && [ "$pypi" != "success" ]; then
          echo "::error::PARTIAL PUBLICATION: the GitHub release for antenati $version was published, but PyPI publication did not succeed."
          exit 1
        fi
        if [ "$pypi" != "success" ] || [ "$ghrelease" != "success" ]; then
          echo "Release publication did not complete; see the jobs above for details."
          exit 1
        fi
        echo "antenati $version was published successfully to both PyPI and GitHub Releases."
